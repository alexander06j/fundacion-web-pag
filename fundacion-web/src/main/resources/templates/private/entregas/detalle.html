<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<head th:replace="~{fragments/head :: head('Detalle de Entrega')}"></head>

<body>
<nav th:replace="~{fragments/navbar-admin :: navbar}"></nav>
<div class="container">

    <div class="page-header">
        <h1>Detalle de Entrega #<span th:text="${entrega.id}"></span></h1>

        <div class="header-actions">
            <a th:href="@{/dashboard/entregas/{id}/acta-pdf(id=${entrega.id})}" class="btn btn-pdf">
                📄 Descargar Acta de Entrega (PDF)
            </a>

            <a th:href="@{/dashboard/entregas}" class="btn btn-secondary">
                Volver al Historial
            </a>
        </div>
    </div>

    <div class="card" style="margin-bottom: 24px;">
        <h3 style="margin-bottom: 16px; color: #1e3a8a;">Información General</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Fecha de Entrega:</label>
                <p th:text="${entrega.fechaEntrega}" style="font-weight: 600;"></p>
            </div>
            <div class="form-group">
                <label>Beneficiario:</label>
                <p th:text="${entrega.beneficiarioNombre}" style="font-weight: 600;"></p>
            </div>
            <div class="form-group">
                <label>Parroquia:</label>
                <p th:text="${entrega.parroquiaNombre}" style="font-weight: 600;"></p>
            </div>
            <div class="form-group">
                <label>Observaciones:</label>
                <p
                        th:text="${entrega.observacion != null and !entrega.observacion.isEmpty() ? entrega.observacion : 'Sin observaciones'}">
                </p>
            </div>
        </div>

        <div th:replace="~{fragments/auditoria :: panel(${entrega})}"></div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 16px; color: #1e3a8a;">Productos Entregados</h3>
        <div class="tabla-responsive">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="det : ${entrega.detalles}">
                    <td th:text="${det.productoNombre}"></td>
                    <td>
                        <span class="badge badge-success" th:text="${det.cantidad} + ' unidades'"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(entrega.detalles)}">
                    <td colspan="2">No hay detalles registrados para esta entrega.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
