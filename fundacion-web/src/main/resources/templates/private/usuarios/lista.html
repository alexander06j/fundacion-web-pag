<!DOCTYPE html>
<meta charset="UTF-8">
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Usuarios')}"></head>

<body>
<nav th:replace="~{fragments/navbar-admin :: navbar}"></nav>
<div class="container">

    <div class="page-header">
        <h1>Gestión de Usuarios</h1>

        <a th:href="@{/dashboard/usuarios/nuevo}" class="btn btn-primary">
            ➕ Nuevo Usuario
        </a>
    </div>

    <div th:if="${mensajeExito}" class="success-alert" style="margin-bottom: 20px;">
        ✅ <span th:text="${mensajeExito}"></span>
    </div>

    <div th:if="${errorMensaje}" class="error-alert" style="margin-bottom: 20px;">
        ⚠️ <span th:text="${errorMensaje}"></span>
    </div>

    <!-- Buscador / Filtro Rápido -->
    <div class="card" style="margin-bottom: 20px; padding: 16px;">
        <input type="text" id="buscadorTabla" class="form-control" placeholder="🔍 Buscar por usuario, nombre o rol..." onkeyup="filtrarTabla()">
    </div>

    <div class="card">
        <div class="tabla-responsive">
            <table class="tabla" id="tablaUsuarios">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre Completo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td>
                        <span th:text="${u.username}"></span>
                        <span th:if="${u.username == usuarioUsername}" class="badge badge-neutral">Tú</span>
                    </td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td>
                        <span th:class="${u.rol.name() == 'ADMIN'} ? 'badge badge-info' : (${u.rol.name() == 'OPERADOR'} ? 'badge badge-success' : 'badge badge-neutral')"
                              th:text="${u.rol.descripcion}"></span>
                    </td>
                    <td>
                        <span th:class="${u.activo} ? 'badge badge-success' : 'badge badge-danger'"
                              th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td>
                        <div class="acciones">
                            <a th:href="@{/dashboard/usuarios/{id}/editar(id=${u.id})}" class="btn btn-primary">
                                Editar
                            </a>

                            <form th:if="${u.username != usuarioUsername}"
                                  th:action="@{/dashboard/usuarios/{id}/estado(id=${u.id})}"
                                  method="post"
                                  th:attr="data-nombre=${u.username},data-accion=${u.activo} ? 'desactivar' : 'activar'"
                                  onsubmit="return confirmarCambioEstado(this);">
                                <button type="submit"
                                        th:class="${u.activo} ? 'btn btn-danger' : 'btn btn-success'"
                                        th:text="${u.activo} ? 'Desactivar' : 'Activar'">
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6">No existen usuarios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    function confirmarCambioEstado(form) {
        const nombre = form.dataset.nombre;
        const accion = form.dataset.accion;
        return confirm(`¿Desea ${accion} al usuario "${nombre}"?`);
    }

    function filtrarTabla() {
        const filter = document.getElementById("buscadorTabla").value.toLowerCase();
        document.querySelectorAll("#tablaUsuarios tbody tr").forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(filter) ? "" : "none";
        });
    }
</script>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
