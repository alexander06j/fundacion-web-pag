<!DOCTYPE html>
<meta charset="UTF-8">
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(${titulo})}"></head>

<body>
<nav th:replace="~{fragments/navbar-admin :: navbar}"></nav>
<div class="container">

    <div class="page-header">
        <h1 th:text="${titulo}"></h1>

        <a th:href="@{/dashboard/usuarios}" class="btn btn-secondary">
            Volver
        </a>
    </div>

    <div class="card">
        <form th:action="${modoEdicion}
                ? @{/dashboard/usuarios/{id}(id=${usuarioId})}
                : @{/dashboard/usuarios}"
              th:object="${usuario}"
              method="post"
              autocomplete="off">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre de Usuario</label>
                    <input type="text" th:field="*{username}" class="form-control"
                           th:readonly="${modoEdicion}"
                           placeholder="Ej. maria.romero">
                    <small th:if="${modoEdicion}" style="color:#64748b;">
                        El nombre de usuario no se puede modificar.
                    </small>
                    <small class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
                </div>

                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" th:field="*{nombreCompleto}" class="form-control"
                           placeholder="Ej. María Elena Romero">
                    <small class="error" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></small>
                </div>

                <div class="form-group full-width">
                    <label>Rol</label>
                    <select th:field="*{rol}" class="form-control">
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r.descripcion}">
                        </option>
                    </select>
                    <small style="color:#64748b;">
                        <b>Administrador:</b> control total, eliminación de registros y gestión de usuarios.<br>
                        <b>Operador:</b> registra y edita productos, beneficiarios y entregas.<br>
                        <b>Lector:</b> solo consulta y visualización de datos (no puede crear, editar ni eliminar).
                    </small>
                    <small class="error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></small>
                </div>

                <div class="form-group">
                    <label th:text="${modoEdicion} ? 'Nueva Contraseña (opcional)' : 'Contraseña'"></label>
                    <input type="password" name="password" class="form-control"
                           autocomplete="new-password"
                           th:placeholder="${modoEdicion} ? 'Dejar en blanco para mantener la actual' : 'Mínimo 8 caracteres'">
                    <small class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" name="confirmarPassword" class="form-control"
                           autocomplete="new-password"
                           placeholder="Repita la contraseña">
                    <small class="error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></small>
                </div>

            </div>

            <!-- Botones de acción alineados a la derecha -->
            <div class="form-actions">
                <a th:href="@{/dashboard/usuarios}" class="btn btn-secondary">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-success">
                    <span th:text="${modoEdicion} ? 'Actualizar Usuario' : 'Guardar Usuario'"></span>
                </button>
            </div>

        </form>
    </div>

</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
